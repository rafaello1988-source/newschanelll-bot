name: Пост новостей в канал

on:
  schedule:
    # Запуск 3 раза в день (время в UTC: 06:00 = 09:00 МСК, 11:00 = 14:00 МСК, 17:00 = 20:00 МСК)
    - cron: '0 6  * * *'   
    - cron: '0 11 * * *'   
    - cron: '0 17 * * *'   
  workflow_dispatch:       # Позволяет запускать вручную кнопкой

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install python-telegram-bot==20.7 feedparser==6.0.11

      - name: Опубликовать новости
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot_github.py
