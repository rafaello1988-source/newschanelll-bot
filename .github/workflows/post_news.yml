name: Пост новостей в канал

on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 по Москве (UTC+3)
    - cron: '0 11 * * *'  # 14:00 по Москве (UTC+3)
    - cron: '0 17 * * *'  # 20:00 по Москве (UTC+3)
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  post-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser python-telegram-bot

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot_github.py
